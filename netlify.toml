# Nuxt is auto-detected by Netlify (Nitro "netlify" preset): SSR runs as a Netlify Function.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
