<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,800&display=block" rel="stylesheet">
<style>
/* ?v=fav  → rounded lime square filling the canvas (transparent corners) — browser tab
   ?v=app  → full-bleed lime square (iOS/Android round the corners themselves)
   ?v=mask → full-bleed, mark shrunk into the maskable safe zone */
html,body{margin:0;width:512px;height:512px;overflow:hidden;background:transparent}
.tile{position:relative;width:512px;height:512px;display:grid;place-items:center;background:#d4ff3a}
.fav .tile{border-radius:22%}
.mark{position:relative;width:var(--m);height:var(--m);transform:rotate(-8deg)}
.a{position:absolute;inset:0;display:grid;place-items:center;font-family:'Bricolage Grotesque';font-weight:800;font-variation-settings:'wdth' 85;font-size:calc(var(--m)*1.02);line-height:1;letter-spacing:-.06em;color:#0c0c0e;transform:translate(-9%,-10%)}
.dot{position:absolute;width:calc(var(--m)*.21);height:calc(var(--m)*.21);right:6%;bottom:12%;border-radius:50%;background:#ff5a36;border:calc(var(--m)*.035) solid #0c0c0e}
.fav{--m:400px}.app{--m:380px}.mask{--m:300px}
</style></head><body><script>document.body.className=new URLSearchParams(location.search).get('v')||'app'</script>
<div class="tile"><div class="mark"><span class="a">a</span><i class="dot"></i></div></div>
</body></html>
